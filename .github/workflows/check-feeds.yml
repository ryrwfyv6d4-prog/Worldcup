name: Check feeds

# The dev container has no outbound access to ESPN, so this is how the live
# feeds get verified. Runs every morning as well as on demand: the fixture
# parser broke silently once because a format change produced output that was
# well-formed and wrong, and nothing was watching for it.
on:
  workflow_dispatch:
  schedule:
    - cron: '0 19 * * *'   # ~5am Melbourne, before anyone opens the app

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # The one that matters: runs the real parser over the real feed and
      # asserts what a person would notice. Fails the job.
      - name: openfootball fixture parser
        working-directory: premier
        run: node scripts/check-fixtures.mjs

      - name: ESPN live-score feed
        working-directory: premier
        run: node scripts/check-feeds.mjs

      - name: ESPN match summary shape
        working-directory: premier
        run: node scripts/probe-summary.mjs

      - name: openfootball fixture feed
        run: |
          for f in 1-premierleague 2-championship; do
            url="https://raw.githubusercontent.com/openfootball/england/master/2026-27/$f.txt"
            code=$(curl -s -o /tmp/$f.txt -w "%{http_code}" "$url")
            echo "$f: HTTP $code, $(wc -l < /tmp/$f.txt) lines, $(grep -c ' v ' /tmp/$f.txt || true) unplayed fixtures, $(grep -cE '[0-9]+-[0-9]+' /tmp/$f.txt || true) with scores"
          done
