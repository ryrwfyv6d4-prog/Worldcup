name: Deploy

on:
  push:
    branches: [claude/world-cup-sweep-app-oFZHS]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install app dependencies
        run: npm ci

      - name: Deploy Cloudflare Worker
        working-directory: worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        continue-on-error: true

      - name: Set Worker YouTube API key
        working-directory: worker
        run: echo "$YOUTUBE_API_KEY" | npx wrangler secret put YOUTUBE_API_KEY
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        continue-on-error: true

      - name: Set Worker YouTube API key backup
        working-directory: worker
        run: echo "$YOUTUBE_API_KEY_BACKUP" | npx wrangler secret put YOUTUBE_API_KEY_BACKUP
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          YOUTUBE_API_KEY_BACKUP: ${{ secrets.YOUTUBE_API_KEY_BACKUP }}
        continue-on-error: true

      - name: Build React app
        run: npm run build
        env:
          VITE_WALL_API_URL: https://worldcup.phil-remington.workers.dev
          VITE_YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          VITE_YOUTUBE_API_KEY_BACKUP: ${{ secrets.YOUTUBE_API_KEY_BACKUP }}

      # Stamp each build so gh-pages always gets a new commit — without this,
      # a retriggered deploy with identical output is silently skipped and
      # GitHub Pages never re-publishes after a transient failure
      - name: Stamp build
        run: echo "${{ github.sha }} $(date -u +%Y-%m-%dT%H:%M:%SZ)" > dist/build-stamp.txt

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: false
